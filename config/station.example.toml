[station]
name = "My Ground Station"
# Replace these with your antenna location. Never commit a precise home address.
latitude_deg = 34.0522
longitude_deg = -118.2437
altitude_m = 90.0
timezone = "America/Los_Angeles"
min_elevation_deg = 20.0

[storage]
root = "data/observations"
tle_file = "data/tle/weather.tle"

[radio]
driver = "rtl_sdr"
device = "0"
sample_rate_hz = 1024000
gain_db = 38.6
ppm = 0
bias_tee = false

[decoder]
driver = "satdump"
executable = "satdump"
pipeline = "meteor_m2-x_lrpt"
input_level = "baseband"

[tle]
url = "https://celestrak.org/NORAD/elements/gp.php?GROUP=weather&FORMAT=tle"
max_age_hours = 24

[[satellites]]
name = "METEOR-M2 3"
norad_id = 57166
enabled = true
downlink_hz = 137900000
mode = "LRPT"

[[satellites]]
name = "METEOR-M2 4"
norad_id = 59051
enabled = true
# Operational frequencies can change; confirm before a scheduled capture.
downlink_hz = 137100000
mode = "LRPT"

